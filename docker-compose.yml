version: "3.9"

# One-command startup:  docker compose up --build
# Frontend : http://localhost:3000
# Backend  : http://localhost:8080
# Postgres : localhost:5432

services:
  db:
    image: postgres:16-alpine
    container_name: canteen-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canteen}
      POSTGRES_USER: ${POSTGRES_USER:-canteen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canteen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: canteen-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-canteen}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-canteen}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_very_long_random_string_min_32_chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_ID: ${ADMIN_ID:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: canteen-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
